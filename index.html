<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #38bdf8; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { background: #38bdf8; border: 5px solid white; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="360"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let playerY = 250;
        let velY = 0;
        let isJumping = false;

        function draw() {
            ctx.clearRect(0, 0, 800, 360);
            
            // ज़मीन
            ctx.fillStyle = "green";
            ctx.fillRect(0, 300, 800, 60);

            // बंटी (Bunty)
            ctx.fillStyle = "white";
            ctx.fillRect(50, playerY, 50, 50);

            // फिजिक्स
            if (!isJumping) {
                playerY = 250;
            } else {
                velY += 1;
                playerY += velY;
                if (playerY >= 250) {
                    playerY = 250;
                    isJumping = false;
                }
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('keydown', () => {
            if (!isJumping) {
                isJumping = true;
                velY = -15;
            }
        });

        draw();
    </script>
</body>
</html>
