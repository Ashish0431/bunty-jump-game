<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bunty's Escape 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Let clicks pass through to the 3D canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #gameOverScreen {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: white;
            display: none;
            pointer-events: auto; /* Allow clicking here */
        }

        #gameOverScreen h1 { color: #ef4444; font-size: 40px; margin-bottom: 10px; }
        #gameOverScreen button {
            padding: 10px 20px; font-size: 20px; font-weight: bold;
            background: #facc15; border: none; border-radius: 8px;
            cursor: pointer; margin-top: 20px;
        }
        
        .controls-hint {
            text-align: center; color: white; font-size: 16px;
            text-shadow: 1px 1px 2px black; margin-bottom: 10px;
        }
    </style>
    <!-- Three.js Library Load -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- UI Layer over the 3D Canvas -->
    <div id="ui-layer">
        <div class="header">
            <div id="scoreText">Score: 0</div>
            <div>🐰 Bunty 3D</div>
        </div>
        <div class="controls-hint">Tap Screen or Press SPACE to Jump</div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen">
        <h1>GAME OVER</h1>
        <p id="finalScore">Score: 0</p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB'); // Sky Blue
        scene.fog = new THREE.Fog('#87CEEB', 10, 50); // Adds depth

        // 2. Camera Setup
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10); // Position behind and slightly above
        camera.lookAt(0, 0, -10);

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Enable Shadows
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 4. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        scene.add(dirLight);

        // 5. Game Objects
        // Ground
        const groundGeo = new THREE.PlaneGeometry(50, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: '#228B22' }); // Forest Green
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Player (Bunty)
        const playerGeo = new THREE.BoxGeometry(1, 1.5, 1);
        const playerMat = new THREE.MeshStandardMaterial({ color: '#ffffff' }); // White
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 0.75, 0);
        player.castShadow = true;
        scene.add(player);

        // Game Variables
        let isGameOver = false;
        let score = 0;
        let gameSpeed = 0.3;
        
        // Player Physics
        let vy = 0;
        let gravity = -0.015;
        let jumpForce = 0.35;
        let isGrounded = true;

        let obstacles = [];
        let frames = 0;

        // UI Elements
        const scoreUI = document.getElementById('scoreText');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreUI = document.getElementById('finalScore');

        // 6. Controls
        function jump() {
            if (isGameOver) return;
            if (isGrounded) {
                vy = jumpForce;
                isGrounded = false;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') jump();
        });
        window.addEventListener('touchstart', jump);
        window.addEventListener('mousedown', jump);

        // Resize Handler
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // 7. Spawn Obstacles
        function spawnObstacle() {
            const obsGeo = new THREE.BoxGeometry(1.5, 1, 1.5);
            const obsMat = new THREE.MeshStandardMaterial({ color: '#ef4444' }); // Red
            const obstacle = new THREE.Mesh(obsGeo, obsMat);
            
            // Random position on X axis (-2, 0, 2)
            const lanes = [-2, 0, 2];
            const lane = lanes[Math.floor(Math.random() * lanes.length)];
            
            obstacle.position.set(lane, 0.5, -40); // Spawn far away
            obstacle.castShadow = true;
            obstacle.receiveShadow = true;
            
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        // 8. Game Reset
        function restartGame() {
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            score = 0;
            gameSpeed = 0.3;
            player.position.y = 0.75;
            vy = 0;
            isGrounded = true;
            isGameOver = false;
            gameOverScreen.style.display = 'none';
        }

        // 9. Main Game Loop (Animation)
        function animate() {
            requestAnimationFrame(animate);

            if (isGameOver) return;

            frames++;

            // Player Physics Update
            vy += gravity;
            player.position.y += vy;

            // Ground Collision
            if (player.position.y <= 0.75) {
                player.position.y = 0.75;
                vy = 0;
                isGrounded = true;
            }

            // Spawn Obstacles periodically
            if (frames % Math.max(30, Math.floor(80 - gameSpeed * 50)) === 0) {
                spawnObstacle();
            }

            // Move Obstacles & Check Collisions
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += gameSpeed;

                // Simple 3D AABB Collision Detection (Bounding Box)
                const playerBox = new THREE.Box3().setFromObject(player);
                const obsBox = new THREE.Box3().setFromObject(obs);

                // Make player hitbox slightly smaller to be fair
                playerBox.expandByScalar(-0.1); 

                if (playerBox.intersectsBox(obsBox)) {
                    isGameOver = true;
                    finalScoreUI.innerText = `Score: ${Math.floor(score)}`;
                    gameOverScreen.style.display = 'block';
                }

                // Remove obstacles that passed behind the camera
                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // Score and Speed Progression
            score += 0.1;
            scoreUI.innerText = `Score: ${Math.floor(score)}`;
            if (gameSpeed < 0.8) gameSpeed += 0.0001;

            // Render the 3D Scene
            renderer.render(scene, camera);
        }

        // Start Game
        animate();
    </script>
</body>
</html>
