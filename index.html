<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bunty's Escape - Pro Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="scoreboard">
                <div class="score-box lives-box">Lives: <span id="livesText">❤️❤️❤️❤️❤️</span></div>
                <div class="score-box">Score: <span id="scoreText">0</span></div>
                <div class="score-box">Carrots: 🥕 <span id="carrotText">0</span></div>
                <div class="score-box best-box">Best: <span id="highScoreText">0</span></div>
            </div>
        </div>

        <!-- 2D Game Canvas -->
        <canvas id="gameCanvas" width="800" height="360"></canvas>

        <div class="controls-hint">
            <b>Desktop:</b> [W/Space/Up] = Jump | [S/Down] = Duck | [P] = Pause | [U] = Upgrade Life<br>
            <b>Mobile:</b> Tap Right Side = Jump | Hold Left Side = Duck
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
